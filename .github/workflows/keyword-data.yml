name: keyword-data

on:
  schedule:
    - cron: "17 9 * * 0"   # 매주 일요일 18:17 KST (키워드 매니저 19:37 실행 전)
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: keyword-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Naver Search Ad keyword tool
        continue-on-error: true
        working-directory: scripts
        env:
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_ACCESS_LICENSE: ${{ secrets.NAVER_AD_ACCESS_LICENSE }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
        run: python naver_keywords.py

      - name: Google Search Console
        continue-on-error: true
        working-directory: scripts
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE: sc-domain:k-brief.com
        run: python gsc_queries.py

      - name: Build summary
        working-directory: scripts
        run: python build_summary.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: weekly keyword update $(TZ=Asia/Seoul date +%F)"
            git push
          fi
